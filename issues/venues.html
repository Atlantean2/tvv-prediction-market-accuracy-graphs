<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Prediction Market Accuracy Graphs — venues</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#venues")</script></head><body><main id="issue"><h2 class="desk">Calibration and Venues<a href="https://atlantean2.github.io/tvv-daily-risk-alert-digest/" style="color:#FFD400;font-size:.6em;margin-left:14px">TVV RISK CENTER</a></h2><p>How well prices matched outcomes, and Polymarket against Kalshi on the same races. Samples in the low-price bands are tiny (1 to 5 races).</p><figure class="g"><img src="img/venues-04.webp" alt="Calibration: 70-90% favourites won more often than priced, a sign of underpricing" loading="lazy"><figcaption><span class="t">Calibration: 70-90% favourites won more often than priced, a sign of underpricing.</span> In the 70-90% bands favourites won nearly every time, so the markets were, if anything, under-confident there. Bins below 70% hold only 1-5 races each, too few to say anything about calibration. [Data: Nov 2-4, 2026]<br><span class="s">Source: <a href="https://polymarket.com/event/which-party-will-win-the-senate-in-2026" target="_blank" rel="noopener">https://polymarket.com/event/which-party-will-win-the-senate-in-2026</a> <a href="https://kalshi.com/markets/controls" target="_blank" rel="noopener">https://kalshi.com/markets/controls</a> <a href="https://apnews.com/projects/elections-2026/" target="_blank" rel="noopener">https://apnews.com/projects/elections-2026/</a> <a href="https://gamma-api.polymarket.com/events" target="_blank" rel="noopener">https://gamma-api.polymarket.com/events</a> <a href="https://api.elections.kalshi.com/trade-api/v2/events" target="_blank" rel="noopener">https://api.elections.kalshi.com/trade-api/v2/events</a></span></figcaption></figure><figure class="g"><img src="img/venues-05.webp" alt="Polymarket vs Kalshi on the same 67 called races: almost identical" loading="lazy"><figcaption><span class="t">Polymarket vs Kalshi on the same 67 called races: almost identical.</span> On the 67 called races both venues listed, prices sat within a few points of each other. The only split favourite was Iowa Senate (Polymarket Hinson 51.5%, Kalshi Turek 51%). The Brier gap (0.033 vs 0.033) is too small to rank them. [Data: Nov 2-4, 2026]<br><span class="s">Source: <a href="https://gamma-api.polymarket.com/events" target="_blank" rel="noopener">https://gamma-api.polymarket.com/events</a> <a href="https://api.elections.kalshi.com/trade-api/v2/events" target="_blank" rel="noopener">https://api.elections.kalshi.com/trade-api/v2/events</a> <a href="https://apnews.com/projects/elections-2026/" target="_blank" rel="noopener">https://apnews.com/projects/elections-2026/</a></span></figcaption></figure><figure class="g"><img src="img/venues-06.webp" alt="16 competitive Senate races: favourites won 12, lost 2, 2 still uncalled" loading="lazy"><figcaption><span class="t">16 competitive Senate races: favourites won 12, lost 2, 2 still uncalled.</span> Of the 16 Senate races TVV tracked as competitive, Polymarket&#x27;s favourite won 12 and lost 2 (Iowa, South Carolina). Alaska and Mississippi are still being counted, and each is a few hundred votes or fewer apart. [Data: Nov 2-4, 2026]<br><span class="s">Source: <a href="https://polymarket.com/event/texas-senate-election-winner" target="_blank" rel="noopener">https://polymarket.com/event/texas-senate-election-winner</a> <a href="https://apnews.com/article/midterm-election-uncalled-races-b20c577aaffced99155af448bd182fa5" target="_blank" rel="noopener">https://apnews.com/article/midterm-election-uncalled-races-b20c5
